<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Candidate Pool, part of Talentbank Career OS — browse pre-screened, open-to-work candidates with verified experience, salary expectations and language skills." />
<title>Candidate Pool — Talentbank Career OS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232b52dd'/%3E%3Cpath d='M5 5l7 7-7 7' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M13 5l7 7-7 7' stroke='%238be3b4' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script type="application/ld+json" id="ldPerson"></script>
<style>
/* ================================================================
   Talentbank Candidate Pool — product design system v3
   Canvas: warm white · Ink: deep slate · Brand: indigo→fuchsia
   Signature: gradient cover banner + circular human avatars
   ================================================================ */
:root{
  --ink:#101b33; --ink-2:#46536e; --ink-3:#8a93a9;
  --bg:#f4f5f9; --surface:#fff;
  --line:#e5e8f0; --line-soft:#edeff5;
  --brand:#4f46e5; --brand-2:#4338ca; --brand-tint:#eef1fe; --brand-line:#dde3fc;
  --grad:linear-gradient(100deg,#232a5c 0%,#3c3f8a 55%,#4f46e5 100%);
  --green:#059669; --green-deep:#047857; --green-tint:#e5f6ef;
  --amber:#b45309; --amber-tint:#fdf3e3; --amber-line:#f4ddb6;
  --violet:#7c3aed; --violet-tint:#f3edfd;
  --sky:#0369a1; --sky-tint:#e0f2fe;
  --focus:#4f46e5;
  --shadow:0 1px 2px rgba(16,27,51,.04),0 12px 32px -16px rgba(16,27,51,.14);
  --shadow-lg:0 2px 4px rgba(16,27,51,.05),0 20px 44px -20px rgba(79,70,229,.25);
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Space Grotesk",var(--body);
  --mono:ui-monospace,"SF Mono","Segoe UI Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);font-size:14px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
button,select,input,textarea{font-family:inherit}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:15px;height:15px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.ic.sm{width:13px;height:13px}
.val{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .card{animation:cardIn .24s cubic-bezier(.2,.7,.3,1) both}
}
@keyframes cardIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- top bar: white product frame with nav ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{display:flex;align-items:center;gap:12px;padding:13px 24px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
.logo{display:grid;place-items:center;width:34px;height:34px;background:var(--grad);color:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(79,70,229,.35);flex-shrink:0}
.logo .ic{width:16px;height:16px;stroke-width:2.4}
.logo .ic .accent{stroke:#a5f3cf}
.wordmark{display:flex;flex-direction:column;line-height:1.25}
.wordmark strong{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.wordmark span{font-size:10.5px;font-weight:500;letter-spacing:.3px;color:var(--ink-3)}
.topbar-right{display:flex;align-items:center;gap:14px;margin-left:auto;flex-shrink:0}
.acct{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand-tint);border:1px solid var(--brand-line);color:var(--brand-2);flex-shrink:0;cursor:pointer;transition:background .13s,border-color .13s}
.acct:hover{background:var(--brand-line)}
@media (max-width:640px){.wordmark span{display:none}}

/* ---------- shell ---------- */
.shell{flex:1;display:grid;grid-template-columns:400px minmax(0,1fr);align-items:stretch;min-height:0;transition:grid-template-columns .18s ease}
.pane-list{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;min-width:0}
.pane-list::-webkit-scrollbar{width:9px}
.pane-list::-webkit-scrollbar-thumb{background:#d4d9e5;border-radius:8px}
.sidebar-toggle{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;flex-shrink:0;transition:background .13s,border-color .13s,color .13s}
.sidebar-toggle:hover{border-color:var(--brand-line);background:var(--brand-tint);color:var(--brand-2)}
@media (min-width:821px){
  body.sidebar-collapsed .shell{grid-template-columns:0 minmax(0,1fr)}
  body.sidebar-collapsed .pane-list{border-right:0;opacity:0;pointer-events:none}
}
@media (max-width:820px){
  .sidebar-toggle{display:none}
}

/* ---------- search & filter panel ---------- */
.filter-panel{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px 13px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.fp-title{display:flex;align-items:center;gap:8px;color:var(--ink)}
.fp-title .ic{color:var(--brand);width:16px;height:16px}
.fp-title span{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.2px}
.count-bubble{display:inline-grid;place-items:center;min-width:24px;height:21px;padding:0 7px;border-radius:20px;background:var(--brand-tint);color:var(--brand-2);font-size:11.5px;font-weight:700;margin-left:2px}
.fp-search{position:relative}
.fp-search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:15px;height:15px;pointer-events:none}
.fp-search input{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px 10px 35px;font-size:13.5px;transition:border-color .15s,box-shadow .15s,background .15s}
.fp-search input::placeholder{color:var(--ink-3)}
.fp-search input:focus-visible{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--brand-tint)}
.fp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fp-field{display:flex;flex-direction:column;gap:5px;position:relative}
.fp-field.full{grid-column:1/-1}
.fp-field label{font-size:11px;letter-spacing:.2px;color:var(--ink-3);font-weight:600}
.fp-field select{
  appearance:none;-webkit-appearance:none;width:100%;
  border:1.5px solid var(--line);border-radius:9px;background:var(--surface);
  color:var(--ink);font-size:12.5px;font-weight:500;
  padding:8px 28px 8px 11px;cursor:pointer;transition:border-color .15s}
.fp-field select:hover{border-color:#c3cbe4}
.fp-field select:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
.fp-field::after{content:"";position:absolute;right:12px;bottom:13px;width:6.5px;height:6.5px;border-right:1.8px solid var(--ink-3);border-bottom:1.8px solid var(--ink-3);transform:rotate(45deg);pointer-events:none}
.fp-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:10px}
.fp-hint{font-size:11.5px;color:var(--ink-3)}
.clear-f{border:0;background:none;color:var(--brand-2);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:7px;margin:-6px -8px}
.clear-f:hover{background:var(--brand-tint)}
@media (max-width:480px){.fp-grid{grid-template-columns:1fr}}

/* ---------- candidate rows ---------- */
.rows{list-style:none;padding:6px 0}
.row{display:flex;gap:12px;align-items:center;padding:13px 20px;cursor:pointer;position:relative;transition:background .13s}
.row::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:transparent;transition:background .13s}
.row:hover{background:#f7f8fc}
.row.sel,.row.sel:hover{background:var(--brand-tint)}
.row.sel::before,.row.sel:hover::before{background:var(--brand)}
.row.sel .row-t strong{color:var(--brand-2)}
.avatar{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--bg);flex-shrink:0;overflow:hidden;position:relative}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row-main{flex:1;min-width:0}
.row-t{display:flex;align-items:center;gap:6px}
.row-t strong{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.row-role{font-size:12.5px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.row-meta .dot-sep{width:2.5px;height:2.5px;border-radius:50%;background:#c3cbdd;flex-shrink:0}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.sal{font-size:12.5px;font-weight:700;color:var(--green-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvl{font-size:10px;letter-spacing:.1px;font-weight:600;padding:2.5px 8px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.lvl-fresh{background:var(--sky-tint);color:var(--sky)}
.lvl-exp{background:var(--amber-tint);color:var(--amber)}
.lvl-senior{background:var(--violet-tint);color:var(--violet)}
.row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.empty-rows{display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--ink-3);font-size:13px;padding:44px 20px}
.empty-rows p{margin-bottom:12px}
.empty-reset{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer}
.empty-reset:hover{border-color:var(--brand);color:var(--brand-2);background:var(--brand-tint)}

/* ---------- detail pane ---------- */
.pane-detail{overflow-y:auto;padding:20px 28px 64px;min-width:0}
.detail-in{max-width:1280px;margin:0 auto}
.mob-back{display:none;align-items:center;gap:8px;border:0;background:none;color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer;padding:0 0 14px}
.mob-back:hover{color:var(--brand-2)}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;margin-bottom:14px;box-shadow:var(--shadow)}

/* two-column layout */
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:14px;align-items:start}
.main-col .card,.side-col .card{margin-bottom:14px}
.main-col .card:last-child{margin-bottom:0}
.side-col{position:sticky;top:0}
.side-col .card:last-child{margin-bottom:0}
@media (max-width:1080px){.detail-grid{grid-template-columns:1fr}.side-col{position:static}}

/* ---------- profile hero: gradient cover + overlapping avatar ---------- */
.profile-card{overflow:hidden;box-shadow:var(--shadow-lg)}
.cover{height:104px;background:var(--grad);position:relative}
.cover::after{content:"";position:absolute;inset:0;background:
  radial-gradient(420px 120px at 82% 0%,rgba(255,255,255,.28),transparent 65%),
  radial-gradient(300px 100px at 12% 100%,rgba(255,255,255,.10),transparent 60%)}
.cover-id{position:absolute;top:12px;right:16px;font-family:var(--mono);font-size:10px;letter-spacing:1.2px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 9px;border-radius:6px;z-index:1}
.ph-body{padding:0 26px 22px}
.ph-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:-46px;position:relative;z-index:2}
.avatar-xl{width:104px;height:104px;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 20px rgba(16,27,51,.18);background:var(--bg);overflow:hidden;position:relative;flex-shrink:0}
.avatar-xl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;font-size:13px;font-weight:600;padding:9.5px 15px;cursor:pointer;white-space:nowrap;border:1.5px solid transparent;font-family:inherit;text-decoration:none;transition:background .13s,border-color .13s,color .13s,box-shadow .13s}
.btn .ic{width:14px;height:14px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 14px -4px rgba(79,70,229,.5)}
.btn-primary:hover{background:var(--brand-2)}
.btn-outline{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand-2);background:var(--brand-tint)}
.btn-ghost{background:var(--bg);color:var(--ink-2);border-color:transparent}
.btn-ghost:hover{color:var(--brand-2);background:var(--brand-tint)}
.ph-id{margin-top:14px}
.ph-id h1{font-family:var(--display);font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.6px;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--green-deep);font-family:var(--body);font-size:11.5px;font-weight:700;letter-spacing:.1px;background:var(--green-tint);border-radius:20px;padding:4px 10px 4px 7px;cursor:help;vertical-align:middle}
.verified .ic{width:12px;height:12px}
.ph-role{font-size:15px;color:var(--ink-2);font-weight:600;margin-top:4px}
.ph-meta{font-size:13px;color:var(--ink-3);margin-top:8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ph-meta span{display:inline-flex;align-items:center;gap:5px}
.ph-meta .ic{width:13px;height:13px;color:#a5aec2}
.ph-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:11.5px;letter-spacing:.1px;font-weight:600;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.mint{background:var(--green);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 2px 8px -2px rgba(5,150,105,.5)}
.chip.gold{background:var(--amber-tint);color:var(--amber);border-color:var(--amber-line);font-weight:700}

/* sponsorship banner */
.sponsor-band{display:flex;align-items:center;gap:12px;background:var(--amber-tint);border:1px solid var(--amber-line);border-radius:12px;padding:12px 15px;margin-top:14px}
.sponsor-band .ic{width:18px;height:18px;color:var(--amber);flex-shrink:0}
.sponsor-band strong{display:block;font-size:12.5px;color:#8c3d07}
.sponsor-band span{font-size:12px;color:#a05b1a}

/* stat tiles: colored icon squares */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px}
.stat{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.stat-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;flex-shrink:0}
.stat-ic .ic{width:16px;height:16px;stroke-width:2}
.stat-ic.g,.stat-ic.v,.stat-ic.b,.stat-ic.a,.stat-ic.n{background:var(--bg);color:var(--ink-2)}
.stat-label{font-size:11px;color:var(--ink-3);font-weight:500;display:block;line-height:1.3}
.stat-val{font-family:var(--display);font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px;display:block;line-height:1.25;font-variant-numeric:tabular-nums}

/* ---------- section cards ---------- */
.sec-card{padding:20px 24px 22px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;flex-shrink:0}
.sec-ic .ic{width:15px;height:15px;stroke-width:2}
.sec-ic.brand,.sec-ic.v,.sec-ic.b,.sec-ic.g{background:var(--brand-tint);color:var(--brand)}
.sec-head h2{font-size:15.5px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}

/* experience timeline with company monograms */
.xp{list-style:none;padding:0}
.xp li{display:flex;gap:14px;padding:14px 0}
.xp li+li{border-top:1px solid var(--line-soft)}
.xp li:first-child{padding-top:2px}
.xp li:last-child{padding-bottom:2px}
.co-avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;font-family:var(--display);font-size:14px;font-weight:700;flex-shrink:0}
.xp-body{flex:1;min-width:0}
.xp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xp strong{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.now-badge{font-size:10px;letter-spacing:.2px;font-weight:700;color:var(--green-deep);background:var(--green-tint);padding:2.5px 8px;border-radius:20px}
.xp .co{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:1px}
.xp .when{font-size:12px;color:var(--ink-3);margin-top:1px;display:block}
.xp p{font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.6}

/* skills */
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skill{background:var(--bg);border:1px solid var(--line);border-radius:20px;font-size:12.5px;font-weight:500;padding:6px 14px;color:var(--ink-2);transition:border-color .13s,color .13s,background .13s}
.skill:hover{border-color:var(--brand-line);background:var(--brand-tint);color:var(--brand-2)}

/* about & education */
.about{color:var(--ink-2);font-size:14px;line-height:1.7}
.edu-sub{margin-top:18px;padding-top:18px;border-top:1px solid var(--line-soft);display:flex;gap:14px;align-items:flex-start}
.edu-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--bg);color:var(--ink-2);flex-shrink:0}
.edu-ic .ic{width:19px;height:19px;stroke-width:1.9}
.edu strong{display:block;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:-.1px}
.edu .edu-note{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.certs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.cert-item{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.cert-item .ic{width:14px;height:14px;color:var(--amber);flex-shrink:0}

/* ---------- AI screening summary ---------- */
.screening-card{padding:20px 24px 22px;border:1px solid #e4defc;background:linear-gradient(180deg,#fbfaff,#fff 70%)}
.screening-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.screening-title{display:flex;align-items:center;gap:10px}
.sec-ic.spark{background:var(--grad);color:#fff;box-shadow:0 3px 10px -2px rgba(124,58,237,.45)}
.screening-title h2{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.ai-tag{font-size:10.5px;letter-spacing:.2px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:20px;white-space:nowrap}
.verdict-box{position:relative;background:var(--surface);border:1px solid #e4defc;border-radius:12px;padding:14px 17px 14px 20px;margin-bottom:18px;overflow:hidden}
.verdict-box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.verdict-box p{font-size:15px;font-weight:700;color:var(--ink);line-height:1.55;letter-spacing:-.15px}
.assess-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.assess-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1px;margin-bottom:10px}
.assess-h.pos{color:var(--green-deep)}
.assess-h.neg{color:var(--amber)}
.assess-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.assess-list li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink-2);line-height:1.55}
.assess-list .ic{flex-shrink:0;margin-top:2.5px;width:14px;height:14px}
.assess-list.pos .ic{color:var(--green)}
.assess-list.neg .ic{color:#d97706}
@media (max-width:560px){.assess-grid{grid-template-columns:1fr;gap:18px}}

/* ---------- sidebar ---------- */
.side-card{padding:16px 18px 18px}
.side-h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;letter-spacing:-.1px;color:var(--ink);margin-bottom:12px}
.side-h .ic{width:14px;height:14px;color:var(--brand)}
#notesCard{border:1px solid #f0e6c4;background:#fffdf4}
#notesCard .side-h .ic{color:#ca8a04}
.notes-area{width:100%;min-height:96px;resize:vertical;border:1.5px solid #ede3bd;border-radius:10px;background:#fffef9;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--ink)}
.notes-area::placeholder{color:#a89e7d}
.notes-area:focus-visible{outline:none;border-color:#d9c25c;box-shadow:0 0 0 4px #faf3d3}
.notes-saved{font-size:11px;font-weight:600;color:var(--green-deep);margin-top:7px;display:flex;align-items:center;gap:4px;min-height:14px}
.notes-saved .ic{width:11px;height:11px}
.c-row{display:flex;align-items:center;gap:11px;padding:8px 0}
.c-row+.c-row{border-top:1px solid var(--line-soft)}
.c-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;flex-shrink:0}
.c-ic .ic{width:14px;height:14px;stroke-width:2}
.c-ic.brand,.c-ic.g,.c-ic.v{background:var(--brand-tint);color:var(--brand)}
.c-body{min-width:0;flex:1}
.c-label{font-size:10.5px;font-weight:600;color:var(--ink-3);display:block;letter-spacing:.2px;text-transform:uppercase}
.c-val{font-size:12.5px;font-weight:600;color:var(--ink);display:block;word-break:break-word;text-decoration:none}
a.c-val:hover{color:var(--brand-2)}
.links-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.links-row a{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);text-decoration:none;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;transition:border-color .13s,color .13s,background .13s}
.links-row a:hover{color:var(--brand-2);border-color:var(--brand-line);background:var(--brand-tint)}

/* similar candidates */
.similar-list{list-style:none;display:flex;flex-direction:column}
.similar-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-radius:8px}
.similar-row+.similar-row{border-top:1px solid var(--line-soft)}
.similar-row:hover{background:var(--brand-tint)}
.similar-row:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.avatar.sm{width:32px;height:32px}
.similar-body{min-width:0;flex:1}
.similar-body strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.similar-role{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- print / export ---------- */
@media print{
  html,body{height:auto!important}
  body{display:block!important;background:#fff}
  .topbar,.pane-list,.mob-back,.ph-actions,#notesCard{display:none!important}
  .shell{display:block!important;height:auto!important}
  .pane-detail{display:block!important;overflow:visible!important;height:auto!important;padding:0!important}
  .detail-in{max-width:none}
  .detail-grid{display:block!important}
  .side-col{position:static!important;display:block!important}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .cover{height:60px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .pane-list{border-right:0}
  .pane-detail{display:none}
  body.viewing .pane-list{display:none}
  body.viewing .pane-detail{display:block;padding:14px 14px 48px}
  body.viewing .mob-back{display:inline-flex}
  .cover{height:84px}
  .ph-body{padding:0 18px 18px}
  .ph-top{margin-top:-40px}
  .avatar-xl{width:88px;height:88px}
  .ph-actions{width:100%;padding-bottom:0}
  .ph-actions .btn{flex:1;justify-content:center}
  .sec-card,.screening-card{padding:17px 18px 19px}
}

/* ---------- role switch (topbar) ---------- */
.role-switch{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:border-color .13s,color .13s,background .13s}
.role-switch:hover{border-color:var(--brand-line);color:var(--brand-2);background:var(--brand-tint)}

/* ---------- welcome / role picker ---------- */
.welcome{flex:1;display:flex;flex-direction:column;background:var(--surface);position:relative;overflow:hidden}
.welcome-brand{position:absolute;top:30px;left:36px;display:flex;align-items:center;gap:11px;z-index:2}
.role-split{flex:1;display:flex;align-items:stretch;min-height:560px}
.role-panel{flex:1;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:inherit;position:relative;background:var(--bg);transition:background .18s}
.role-panel:first-child{background:linear-gradient(165deg,#f4f5fb 0%,#eceefa 100%)}
.role-panel:last-child{background:linear-gradient(195deg,#faf8ff 0%,#f4eefd 100%)}
.role-panel:first-child:hover{background:linear-gradient(165deg,#eef0fc 0%,#e3e6f8 100%)}
.role-panel:last-child:hover{background:linear-gradient(195deg,#f6f1fe 0%,#eee3fb 100%)}
.role-panel:focus-visible{outline:2px solid var(--focus);outline-offset:-4px}
.role-panel-in{max-width:360px;padding:48px 44px;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.role-ic{display:grid;place-items:center;width:60px;height:60px;border-radius:16px;background:var(--surface);color:var(--brand);box-shadow:0 10px 24px -10px rgba(79,70,229,.35)}
.role-ic .ic{width:27px;height:27px;stroke-width:1.7}
.role-ic.v{color:var(--violet);box-shadow:0 10px 24px -10px rgba(124,58,237,.35)}
.role-eyebrow{margin-top:20px;font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3)}
.role-panel-in strong{margin-top:6px;font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-1px;color:var(--ink);line-height:1.05}
.role-line{margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.role-go{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--brand-2);margin-top:26px;padding:12px 20px;border-radius:10px;background:var(--surface);border:1.5px solid var(--brand-line);transition:background .15s,color .15s,transform .15s}
.role-go .ic{width:13px;height:13px;transition:transform .15s}
.role-panel:hover .role-go{background:var(--brand);color:#fff;border-color:transparent}
.role-panel:hover .role-go .ic{transform:translateX(3px)}
.role-divider{width:1px;flex-shrink:0;background:var(--line);position:relative;z-index:2}
.role-divider span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:0;color:var(--ink-3);box-shadow:var(--shadow);white-space:nowrap}
@media (max-width:760px){
  .welcome-brand{position:static;padding:24px 24px 0}
  .role-split{flex-direction:column;min-height:0}
  .role-panel{padding:8px 0}
  .role-panel-in{padding:32px 28px;max-width:none}
  .role-divider{width:100%;height:1px}
}

/* ---------- candidate intake ---------- */
.cand-shell{flex:1;display:flex;flex-direction:column;min-height:0}
#recruiterView{flex:1;display:flex;flex-direction:column;min-height:0}
.cand-main{flex:1;background:var(--bg);padding:36px 24px 72px}
.cand-in{max-width:760px;margin:0 auto}
.cand-head{margin-bottom:22px}
.cand-head h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.4px;color:var(--ink)}
.cand-head p{margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.cform-section{padding:22px 24px 24px}
.cform-section+.cform-section{margin-top:14px}
.cform-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cform-field{display:flex;flex-direction:column;gap:6px}
.cform-field.full{grid-column:1/-1}
.cform-field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.cform-field .opt{font-weight:500;color:var(--ink-3)}
.cform-field input,.cform-field select,.cform-field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);
  color:var(--ink);font-size:13.5px;font-family:inherit;padding:10px 12px;
  transition:border-color .15s,box-shadow .15s,background .15s}
.cform-field select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:none}
.cform-field textarea{resize:vertical;min-height:84px;line-height:1.55}
.cform-field input::placeholder,.cform-field textarea::placeholder{color:var(--ink-3)}
.cform-field input:focus-visible,.cform-field select:focus-visible,.cform-field textarea:focus-visible{
  outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--brand-tint)}
.cform-hint{font-size:11.5px;color:var(--ink-3);margin-top:-2px}
.cform-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:20px}
.cform-error{font-size:12.5px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:10px 13px;margin-bottom:16px;display:none}
.cform-error.show{display:block}

/* candidate success state */
.cand-success{padding:32px 28px 30px;text-align:center}
.cand-success .succ-ic{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--green-tint);color:var(--green-deep);margin:0 auto 16px}
.cand-success .succ-ic .ic{width:24px;height:24px;stroke-width:2}
.cand-success h2{font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
.cand-success p{font-size:13.5px;color:var(--ink-2);margin-top:8px;max-width:440px;margin-left:auto;margin-right:auto;line-height:1.6}
.succ-summary{text-align:left;background:var(--bg);border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px;margin:22px 0 6px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.succ-summary div{min-width:0}
.succ-summary span{display:block}
.succ-summary .sl{font-size:10.5px;font-weight:600;letter-spacing:.2px;text-transform:uppercase;color:var(--ink-3)}
.succ-summary .sv{font-size:13px;font-weight:600;color:var(--ink);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-success .cform-actions{justify-content:center;margin-top:22px}
@media (max-width:560px){.cform-grid,.succ-summary{grid-template-columns:1fr}}
</style>
</head>

<script>
/* =====================================================================
   ✏️  EDIT CANDIDATES HERE — change the values, nothing else.
   Fields: slug (url id), tb (candidate id), name, title,
   level ("fresh" | "exp" | "senior"), years (number, for sorting),
   email, phone (+country code), location, qualification, expYears,
   salary, salaryNum (number, for sorting), notice, relocation,
   workMode, nationality, skills[], summary,
   xp[] {role, co, when, now, desc}, edu, links{linkedin, github}.
   Optional: photo (URL or data-URI — shown instead of the colored
   initials avatar when present).
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const state = { level: "all", loc: "all", sort: "name", q: "", selected: null };
const notes = new Map();      // slug -> recruiter note text
const initials = (n) => n.split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const city = (c) => c.location.split(",")[0].trim();
/* colored-initials fallback: hue is stable per name, palette matches the design system */
/* muted, low-saturation tones — enough to tell people apart in a list without competing for attention */
const AVATAR_PALETTE = [
  ["#3c4b6b", "#e7eaf1"], // slate blue
  ["#4b5f57", "#e6ede9"], // sage
  ["#5c5470", "#eae8f0"], // muted plum
  ["#6b5847", "#efe8e1"], // taupe
  ["#42636a", "#e5edee"], // muted teal
  ["#5a5142", "#eeeae1"]  // stone
];
const nameHue = (name) => AVATAR_PALETTE[[...name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AVATAR_PALETTE.length];
function avatarUri(name) {
  const [deep, tint] = nameHue(name);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144"><rect width="144" height="144" rx="72" fill="${tint}"/><text x="72" y="90" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" letter-spacing="-1" fill="${deep}" text-anchor="middle">${initials(name)}</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
/* real photo when provided (c.photo), colored initials otherwise */
const avatarSrc = (c) => c.photo || avatarUri(c.name);
/* company monogram chip for the experience timeline */
function coMono(co) {
  const [deep, tint] = nameHue(co);
  return `<span class="co-avatar" style="background:${tint};color:${deep}">${esc(initials(co.replace(/[^\w\s]/g, " ").trim()))}</span>`;
}
const telHref = (p) => p.replace(/[^\d+]/g, "");

/* other candidates who share skills, level or title with c, best matches first */
function similarCandidates(c) {
  const skillSet = new Set(c.skills.map((s) => s.toLowerCase()));
  return CANDIDATES
    .filter((x) => x.slug !== c.slug)
    .map((x) => {
      const shared = x.skills.filter((s) => skillSet.has(s.toLowerCase())).length;
      let score = shared;
      if (x.level === c.level) score += 1;
      if (x.title === c.title) score += 2;
      return { x, score };
    })
    .filter((m) => m.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3)
    .map((m) => m.x);
}

/* Structured data for the selected candidate */
function setStructuredData(c) {
  $("ldPerson").textContent = c ? JSON.stringify({
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    mainEntity: {
      "@type": "Person",
      name: c.name,
      jobTitle: c.title,
      email: "mailto:" + c.email,
      telephone: c.phone,
      image: avatarSrc(c),
      address: { "@type": "PostalAddress", addressLocality: c.location },
      sameAs: [c.links.linkedin, c.links.github]
    }
  }) : "";
  document.title = c ? `${c.name} - ${c.title} | Candidate Pool` : "Candidate Pool — Talentbank Career OS";
}

/* ---------- filtering & sorting ---------- */
function visibleRows() {
  const q = state.q.toLowerCase();
  let rows = CANDIDATES.filter((c) => {
    if (state.level !== "all" && c.level !== state.level) return false;
    if (state.loc !== "all" && city(c) !== state.loc) return false;
    if (q && ![c.name, c.title, c.location, c.skills.join(" ")].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
  const sorters = {
    "name": (a, b) => a.name.localeCompare(b.name),
    "exp-desc": (a, b) => b.years - a.years,
    "exp-asc": (a, b) => a.years - b.years,
    "salary": (a, b) => a.salaryNum - b.salaryNum
  };
  return rows.sort(sorters[state.sort] || sorters.name);
}

const LVL = { fresh: ["lvl-fresh", "Fresh grad"], exp: ["lvl-exp", "Experienced"], senior: ["lvl-senior", "Senior"] };

function renderList() {
  const rows = visibleRows();
  $("nCount").textContent = rows.length;
  const ul = $("rows");
  if (!rows.length) {
    ul.innerHTML = `
      <li class="empty-rows">
        <svg class="ic" aria-hidden="true" style="width:20px;height:20px;color:var(--ink-3);margin-bottom:8px"><use href="#i-search"/></svg>
        <p>No candidates match your filters.</p>
        <button type="button" class="empty-reset" id="emptyReset">Clear filters</button>
      </li>`;
    $("emptyReset")?.addEventListener("click", resetFilters);
    return;
  }
  ul.innerHTML = "";
  for (const c of rows) {
    const li = document.createElement("li");
    li.className = "row" + (state.selected === c.slug ? " sel" : "");
    li.tabIndex = 0;
    li.setAttribute("role", "button");
    li.setAttribute("aria-current", state.selected === c.slug ? "true" : "false");
    const [lvlCls, lvlTxt] = LVL[c.level];
    li.innerHTML = `
      <span class="avatar"><img alt="" src="${avatarSrc(c)}"></span>
      <span class="row-main">
        <span class="row-t"><strong>${esc(c.name)}</strong></span>
        <span class="row-role">${esc(c.title)}</span>
        <span class="row-meta">
          <span>${esc(city(c))}</span><span class="dot-sep"></span>
          <span>${esc(c.expYears)}</span>
        </span>
      </span>
      <span class="row-right">
        <span class="sal">${esc(c.salary)}</span>
        <span class="lvl ${lvlCls}">${lvlTxt}</span>
      </span>`;
    const go = () => { location.hash = "#/c/" + c.slug; };
    li.addEventListener("click", go);
    li.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
    ul.append(li);
  }
}

          <div class="stat"><span class="stat-ic a"><svg class="ic"><use href="#i-clock"/></svg></span><span><span class="stat-label">Notice period</span><span class="stat-val">${esc(c.notice)}</span></span></div>
          <div class="stat"><span class="stat-ic n"><svg class="ic"><use href="#i-user"/></svg></span><span><span class="stat-label">Nationality</span><span class="stat-val">${esc(c.nationality)}</span></span></div>
        </div>
      </div>
    </section>

    <div class="detail-grid">
      <div class="main-col">
        <section class="card sec-card">
          <div class="sec-head"><span class="sec-ic brand"><svg class="ic"><use href="#i-briefcase"/></svg></span><h2>Experience</h2></div>
          <ul class="xp">
            ${c.xp.map((x) => `
              <li>
                ${coMono(x.co)}
                <div class="xp-body">
                  <div class="xp-top"><strong>${esc(x.role)}</strong>${x.now ? `<span class="now-badge">Current</span>` : ""}</div>
                  <div class="co">${esc(x.co)}</div>
                  <span class="when">${esc(x.when)}</span>
                  <p>${esc(x.desc)}</p>
                </div>
              </li>`).join("")}
          </ul>
        </section>

        <section class="card sec-card">
          <div class="sec-head"><span class="sec-ic v"><svg class="ic"><use href="#i-tag"/></svg></span><h2>Skills</h2></div>
          <div class="skills">${c.skills.map((s) => `<span class="skill">${esc(s)}</span>`).join("")}</div>
        </section>

        <section class="card sec-card">
          <div class="sec-head"><span class="sec-ic b"><svg class="ic"><use href="#i-note"/></svg></span><h2>About & education</h2></div>
          <p class="about">${esc(c.summary)}</p>
          <div class="edu-sub">
            <span class="edu-ic"><svg class="ic"><use href="#i-cap"/></svg></span>
            <div class="edu">
              <strong>${esc(c.edu)}</strong>
              <div class="edu-note">CGPA ${esc(c.cgpa)}</div>
              ${c.certs?.length ? `
              <div class="certs">
                ${c.certs.map((cert) => `<div class="cert-item"><svg class="ic"><use href="#i-award"/></svg>${esc(cert)}</div>`).join("")}
              </div>` : ""}
            </div>
          </div>
        </section>

        <section class="card screening-card">
          <div class="screening-head">
            <div class="screening-title"><span class="sec-ic spark"><svg class="ic"><use href="#i-spark"/></svg></span><h2>Screening Summary</h2></div>
            <span class="ai-tag">AI-assisted · verify before deciding</span>
          </div>
          <div class="verdict-box"><p>${esc(c.verdict)}</p></div>
          <div class="assess-grid">
            <div>
              <div class="assess-h pos"><svg class="ic sm"><use href="#i-check"/></svg>Strengths</div>
              <ul class="assess-list pos">
                ${c.strengths.map((s) => `<li><svg class="ic sm"><use href="#i-check"/></svg>${esc(s)}</li>`).join("")}
              </ul>
            </div>
            <div>
              <div class="assess-h neg"><svg class="ic sm"><use href="#i-caution"/></svg>Areas to watch</div>
              <ul class="assess-list neg">
                ${c.improve.map((s) => `<li><svg class="ic sm"><use href="#i-caution"/></svg>${esc(s)}</li>`).join("")}
              </ul>
            </div>
          </div>
        </section>
      </div>

      <div class="side-col">
        <section class="card side-card" id="notesCard">
          <span class="side-h"><svg class="ic"><use href="#i-note-pen"/></svg>Your notes</span>
          <textarea class="notes-area" id="notesArea" placeholder="Private to you — interview feedback, fit assessment, follow-ups…">${esc(noteVal)}</textarea>
          <div class="notes-saved" id="notesSaved"></div>
        </section>

        <section class="card side-card">
          <span class="side-h"><svg class="ic"><use href="#i-mail"/></svg>Contact</span>
          <div class="c-row">
            <span class="c-ic brand"><svg class="ic"><use href="#i-mail"/></svg></span>
            <span class="c-body"><span class="c-label">Email</span><a class="c-val" href="mailto:${esc(c.email)}" itemprop="email">${esc(c.email)}</a></span>
          </div>
          <div class="c-row">
            <span class="c-ic g"><svg class="ic"><use href="#i-phone"/></svg></span>
            <span class="c-body"><span class="c-label">Phone</span><a class="c-val" href="tel:${telHref(c.phone)}" itemprop="telephone">${esc(c.phone)}</a></span>
          </div>
          <div class="c-row">
            <span class="c-ic v"><svg class="ic"><use href="#i-globe"/></svg></span>
            <span class="c-body"><span class="c-label">Languages</span><span class="c-val">${esc(c.languages.join(", "))}</span></span>
          </div>
          <div class="links-row">
            <a href="${esc(c.links.linkedin)}" target="_blank" rel="noopener"><svg class="ic sm"><use href="#i-external"/></svg> LinkedIn</a>
            <a href="${esc(c.links.github)}" target="_blank" rel="noopener"><svg class="ic sm"><use href="#i-external"/></svg> GitHub</a>
          </div>
        </section>

        ${similar.length ? `
        <section class="card side-card">
          <span class="side-h"><svg class="ic"><use href="#i-users"/></svg>Similar candidates</span>
          <ul class="similar-list">
            ${similar.map((s) => `
              <li class="similar-row" data-slug="${esc(s.slug)}" tabindex="0" role="button">
                <span class="avatar sm"><img alt="" src="${avatarSrc(s)}"></span>
                <span class="similar-body">
                  <strong>${esc(s.name)}</strong>
                  <span class="similar-role">${esc(s.title)}</span>
                </span>
              </li>`).join("")}
          </ul>
        </section>` : ""}
      </div>
    </div>`;

  el.querySelectorAll(".similar-row").forEach((row) => {
    const go = () => { location.hash = "#/c/" + row.dataset.slug; };
    row.addEventListener("click", go);
    row.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
  });
  const back = $("mobBack");
  if (back) back.addEventListener("click", () => { location.hash = "#/"; });
  const printBtn = $("btnPrint");
  if (printBtn) printBtn.addEventListener("click", () => window.print());
  const notesArea = $("notesArea");
  const notesSaved = $("notesSaved");
  if (notesArea) notesArea.addEventListener("input", debounce((e) => {
    notes.set(c.slug, e.target.value);
    notesSaved.innerHTML = `<svg class="ic"><use href="#i-check"/></svg> Note saved`;
  }, 400));
}

/* ---------- router & wiring ---------- */
function route() {
  const m = (location.hash || "").match(/^#\/c\/([\w-]+)/);
  const found = m && CANDIDATES.find((c) => c.slug === m[1]);
  if (found) {
    state.selected = found.slug;
  } else {
    state.selected = window.innerWidth > 820 ? (visibleRows()[0]?.slug || null) : null;
  }
  renderList();
  renderDetail();
  document.querySelector(".pane-detail")?.scrollTo(0, 0);
}

function populateLocations() {
  const sel = $("fLocation");
  [...new Set(CANDIDATES.map(city))].sort().forEach((l) => sel.append(new Option(l, l)));
}
function applyFilters() {
  renderList();
  // keep selection valid within the filtered set on desktop
  if (window.innerWidth > 820 && !visibleRows().some((c) => c.slug === state.selected)) {
    state.selected = visibleRows()[0]?.slug || null;
    renderDetail();
    renderList();
  }
}

function resetFilters() {
  state.level = "all"; state.loc = "all"; state.sort = "name"; state.q = "";
  $("fLevel").value = "all"; $("fLocation").value = "all"; $("fSort").value = "name"; $("q").value = "";
  applyFilters();
}
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

$("q").addEventListener("input", debounce((e) => { state.q = e.target.value; applyFilters(); }, 120));
$("fLevel").addEventListener("change", (e) => { state.level = e.target.value; applyFilters(); });
$("fLocation").addEventListener("change", (e) => { state.loc = e.target.value; applyFilters(); });
$("fSort").addEventListener("change", (e) => { state.sort = e.target.value; applyFilters(); });
$("fClear").addEventListener("click", resetFilters);
window.addEventListener("hashchange", () => { if (getRole() === "recruiter") route(); });
populateLocations();

const sidebarToggle = $("sidebarToggle");
function setSidebarCollapsed(collapsed) {
  document.body.classList.toggle("sidebar-collapsed", collapsed);
  sidebarToggle.setAttribute("aria-pressed", String(collapsed));
  localStorage.setItem("sidebarCollapsed", collapsed ? "1" : "0");
}
sidebarToggle.addEventListener("click", () => {
  setSidebarCollapsed(!document.body.classList.contains("sidebar-collapsed"));
});
setSidebarCollapsed(localStorage.getItem("sidebarCollapsed") === "1");

/* ---------- role selection (welcome screen) ---------- */
const ROLE_KEY = "tbRole";
const CAND_KEY = "tbCandidateProfile";
const getRole = () => localStorage.getItem(ROLE_KEY);

function applyRole() {
  const role = getRole();
  $("welcomeView").classList.toggle("hidden", !!role);
  $("recruiterView").classList.toggle("hidden", role !== "recruiter");
  $("candidateView").classList.toggle("hidden", role !== "candidate");
  if (role === "recruiter") route();
  if (role === "candidate") renderCandidateView();
}
function setRole(role) { localStorage.setItem(ROLE_KEY, role); applyRole(); }
function clearRole() { localStorage.removeItem(ROLE_KEY); applyRole(); }

$("roleRecruiter").addEventListener("click", () => setRole("recruiter"));
$("roleCandidate").addEventListener("click", () => setRole("candidate"));
$("recruiterSwitchRole").addEventListener("click", clearRole);
$("candSwitchRole").addEventListener("click", clearRole);

/* ---------- candidate intake form ---------- */
function candidateFormHTML(d) {
  d = d || {};
  const skillsVal = Array.isArray(d.skills) ? d.skills.join(", ") : (d.skills || "");
  return `
    <div class="cand-head">
      <h1>Build your candidate profile</h1>
      <p>Share your background once — recruiters searching Talentbank's candidate pool will be able to find and contact you directly.</p>
    </div>
    <form id="candForm" novalidate>
      <div class="cform-error" id="candFormError">Please fill in name, title, email, location and a short summary before submitting.</div>

      <section class="card cform-section">
        <div class="sec-head"><span class="sec-ic brand"><svg class="ic"><use href="#i-user"/></svg></span><h2>Basic details</h2></div>
        <div class="cform-grid">
          <div class="cform-field"><label for="cfName">Full name</label><input id="cfName" name="name" type="text" placeholder="e.g. Nur Aisyah Binti Yusof" value="${esc(d.name || "")}" required></div>
          <div class="cform-field"><label for="cfTitle">Professional title</label><input id="cfTitle" name="title" type="text" placeholder="e.g. Junior Full-Stack Engineer" value="${esc(d.title || "")}" required></div>
          <div class="cform-field"><label for="cfEmail">Email</label><input id="cfEmail" name="email" type="email" placeholder="you@example.com" value="${esc(d.email || "")}" required></div>
          <div class="cform-field"><label for="cfPhone">Phone <span class="opt">(optional)</span></label><input id="cfPhone" name="phone" type="tel" placeholder="+60 12-345 6789" value="${esc(d.phone || "")}"></div>
          <div class="cform-field"><label for="cfLocation">Location</label><input id="cfLocation" name="location" type="text" placeholder="e.g. Kuala Lumpur, Malaysia" value="${esc(d.location || "")}" required></div>
          <div class="cform-field"><label for="cfNationality">Nationality <span class="opt">(optional)</span></label><input id="cfNationality" name="nationality" type="text" placeholder="e.g. Malaysian" value="${esc(d.nationality || "")}"></div>
        </div>
      </section>

      <section class="card cform-section">
        <div class="sec-head"><span class="sec-ic b"><svg class="ic"><use href="#i-briefcase"/></svg></span><h2>Experience &amp; preferences</h2></div>
        <div class="cform-grid">
          <div class="cform-field">
            <label for="cfLevel">Experience level</label>
            <select id="cfLevel" name="level">
              <option value="fresh"${d.level === "fresh" ? " selected" : ""}>Fresh graduate</option>
              <option value="exp"${d.level === "exp" || !d.level ? " selected" : ""}>Experienced (1–4 yrs)</option>
              <option value="senior"${d.level === "senior" ? " selected" : ""}>Senior (5+ yrs)</option>
            </select>
          </div>
          <div class="cform-field"><label for="cfYears">Years of experience</label><input id="cfYears" name="years" type="number" min="0" step="1" placeholder="e.g. 2" value="${esc(d.years ?? "")}"></div>
          <div class="cform-field"><label for="cfSalary">Expected salary</label><input id="cfSalary" name="salary" type="text" placeholder="e.g. RM 4,800/mo" value="${esc(d.salary || "")}"></div>
          <div class="cform-field">
            <label for="cfNotice">Notice period</label>
            <select id="cfNotice" name="notice">
              <option${d.notice === "Immediate" || !d.notice ? " selected" : ""}>Immediate</option>
              <option${d.notice === "2 weeks" ? " selected" : ""}>2 weeks</option>
              <option${d.notice === "1 month" ? " selected" : ""}>1 month</option>
              <option${d.notice === "2 months" ? " selected" : ""}>2 months</option>
              <option${d.notice === "3 months" ? " selected" : ""}>3 months</option>
            </select>
          </div>
          <div class="cform-field">
            <label for="cfWorkMode">Work mode preference</label>
            <select id="cfWorkMode" name="workMode">
              <option${d.workMode === "On-site" || !d.workMode ? " selected" : ""}>On-site</option>
              <option${d.workMode === "Hybrid" ? " selected" : ""}>Hybrid</option>
              <option${d.workMode === "Remote" ? " selected" : ""}>Remote</option>
            </select>
          </div>
          <div class="cform-field">
            <label for="cfRelocation">Open to relocation?</label>
            <select id="cfRelocation" name="relocation">
              <option${d.relocation === "Yes" || !d.relocation ? " selected" : ""}>Yes</option>
              <option${d.relocation === "No" ? " selected" : ""}>No</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card cform-section">
        <div class="sec-head"><span class="sec-ic v"><svg class="ic"><use href="#i-tag"/></svg></span><h2>Skills, links &amp; summary</h2></div>
        <div class="cform-grid">
          <div class="cform-field full">
            <label for="cfSkills">Key skills</label>
            <input id="cfSkills" name="skills" type="text" placeholder="e.g. React, Node.js, SQL — separate with commas" value="${esc(skillsVal)}">
          </div>
          <div class="cform-field full">
            <label for="cfEducation">Education <span class="opt">(optional)</span></label>
            <input id="cfEducation" name="education" type="text" placeholder="e.g. Bachelor of Computer Science — Universiti Malaya, 2025" value="${esc(d.education || "")}">
          </div>
          <div class="cform-field"><label for="cfLinkedin">LinkedIn <span class="opt">(optional)</span></label><input id="cfLinkedin" name="linkedin" type="url" placeholder="https://linkedin.com/in/…" value="${esc(d.linkedin || "")}"></div>
          <div class="cform-field"><label for="cfGithub">GitHub <span class="opt">(optional)</span></label><input id="cfGithub" name="github" type="url" placeholder="https://github.com/…" value="${esc(d.github || "")}"></div>
          <div class="cform-field full">
            <label for="cfSummary">Professional summary</label>
            <textarea id="cfSummary" name="summary" placeholder="A few sentences on your experience, what you're looking for, and what makes you a strong candidate." required>${esc(d.summary || "")}</textarea>
          </div>
        </div>
      </section>

      <div class="cform-actions">
        <button type="submit" class="btn btn-primary">Submit profile</button>
      </div>
    </form>`;
}

function candidateSuccessHTML(d) {
  return `
    <section class="card cand-success">
      <span class="succ-ic"><svg class="ic"><use href="#i-check"/></svg></span>
      <h2>Profile submitted</h2>
      <p>Thanks, ${esc(d.name.split(" ")[0])} — your profile has been added to Talentbank's candidate pool. Recruiters hiring for roles that match your skills will be able to find and reach out to you directly.</p>
      <div class="succ-summary">
        <div><span class="sl">Name</span><span class="sv">${esc(d.name)}</span></div>
        <div><span class="sl">Title</span><span class="sv">${esc(d.title)}</span></div>
        <div><span class="sl">Email</span><span class="sv">${esc(d.email)}</span></div>
        <div><span class="sl">Location</span><span class="sv">${esc(d.location)}</span></div>
      </div>
      <div class="cform-actions">
        <button class="btn btn-outline" id="candEditBtn" type="button">Edit profile</button>
      </div>
    </section>`;
}

function renderCandidateView() {
  const saved = JSON.parse(localStorage.getItem(CAND_KEY) || "null");
  const el = $("candContent");
  if (saved) {
    el.innerHTML = candidateSuccessHTML(saved);
    $("candEditBtn").addEventListener("click", () => {
      el.innerHTML = candidateFormHTML(saved);
      wireCandidateForm();
    });
  } else {
    el.innerHTML = candidateFormHTML(null);
    wireCandidateForm();
  }
}

function wireCandidateForm() {
  const form = $("candForm");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const get = (k) => String(fd.get(k) || "").trim();
    const required = ["name", "title", "email", "location", "summary"];
    if (required.some((k) => !get(k))) {
      $("candFormError").classList.add("show");
      return;
    }
    $("candFormError").classList.remove("show");
    const data = {
      name: get("name"), title: get("title"), email: get("email"), phone: get("phone"),
      location: get("location"), nationality: get("nationality"),
      level: get("level"), years: get("years"), salary: get("salary"),
      notice: get("notice"), workMode: get("workMode"), relocation: get("relocation"),
      skills: get("skills").split(",").map((s) => s.trim()).filter(Boolean),
      education: get("education"), linkedin: get("linkedin"), github: get("github"),
      summary: get("summary"),
    };
    localStorage.setItem(CAND_KEY, JSON.stringify(data));
    renderCandidateView();
    window.scrollTo(0, 0);
  });
}

applyRole();
</script>
</body>
</html>
